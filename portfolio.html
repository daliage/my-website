<!DOCTYPE html>
<html lang="en">
    <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Portfolio</title>
  <link rel="stylesheet" href="portfolio.css">
    </head>
    <body>
        <main>
        <h1>Image Portfolio</h1><br>
        <a href="index.html">Return home</a>
        <h2>Mostly projects and stuff I've built, but there's some bonus stuff in here too :)</h2>
        <div class="grid">
        <figure>
          <img src="images/bass.jpg" width="250px" alt="my custom-built bass"> 
          <figcaption><sub>A bass I built on my own (with some help staining / finishing wood from my Dad). The lights were my idea from when I had the blinds in my bedroom flipped a different way, long story.</sub></figcaption>
        </figure>
        <figure>
          <img src="images/computer.jpg" width="250px" alt="my computer">
          <figcaption><sub>My computer that I built, not much to say about it tbh</sub></figcaption>
        </figure>
        <figure>
            <img src="images/homelab.jpg" alt="my homelab (much more disorganized than normal)">
            <figcaption><sub>My homelab, consisting of a switch, access point, headless laptop running most things, and a big workstation that I used to use as a NAS until I realized it drew 120W idle. It doesn't normally look this messy, trust me</sub></figcaption>
        </figure>
        <figure>
            <img src="images/dog.jpg" alt="dog (her name is Philly)">
            <figcaption><sub>My dog; her name is Philly. She doesn't have a collar because she eats it whenever we put one on her.</sub></figcaption>
        </figure>
        <figure>
            <img src="images/battery.jpg" alt="mildly sketchy setup to make sure my house doesn't burn down">
            <figcaption><sub>This is from the time I bought a laptop off eBay, opened it up to find a pillowed battery, and then had to leave the house in 5 minutes, so I set up all this to make sure the battery didn't explode while I was away. My house is still standing</sub></figcaption>
        </figure>
        <figure>
            <img src="images/wall.jpg" alt="wall">
            <figcaption><sub>A wall in my house (did not burn down because of an exploded laptop battery)</sub></figcaption>
        </figure>
        </div>
        </main>
    </body>
</html>
